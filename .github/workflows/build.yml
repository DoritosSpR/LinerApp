name: Build iOS App
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Install xtool
        run: |
          brew tap xtool-org/tap
          brew trust xtool-org/tap
          brew install xtool
      
      - name: Prepare Resources in target
        run: |
          # SwiftPM espera Resources dentro del target (Sources/LinerApp/Resources/)
          cp -r Resources Sources/LinerApp/
      
      - name: Build IPA
        run: xtool dev build --ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinerApp.ipa
          path: .build/**/*.ipa
          retention-days: 30
